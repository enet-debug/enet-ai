name: Build eNet AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Publish v0.1.0 source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand initial design source and assets
        shell: bash
        run: |
          set -euo pipefail
          if [ -f bootstrap/source.tar.xz.b64 ]; then
            base64 --decode bootstrap/source.tar.xz.b64 | tar -xJf -
            npm install --no-audit --no-fund
            mkdir -p src/fonts
            for weight in 400 500 600 700; do
              cp "node_modules/@fontsource/inter/files/inter-latin-${weight}-normal.woff2" "src/fonts/Inter-${weight}.woff2"
            done
            npx tauri icon src-tauri/icons/icon.svg
            node --check src/app.js
            rm -rf bootstrap
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --staged --quiet || git commit -m 'feat: import eNet AI v0.1.0 interface and desktop project'
            git push origin HEAD:main
          fi

  build:
    name: ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, bundle: nsis, label: Windows EXE }
          - { os: ubuntu-22.04, bundle: deb, label: Linux DEB }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Ubuntu native Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci --no-audit --no-fund
      - name: Validate project
        shell: bash
        run: |
          node --check src/app.js
          test -f src-tauri/icons/icon.ico
          test -f src/fonts/Inter-400.woff2
      - name: Build installer
        run: npx tauri build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: enet-ai-v0.1.0-${{ matrix.bundle }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
