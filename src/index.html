<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatly</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--logo1)"/><stop offset="1" style="stop-color:var(--logo2)"/>
    </linearGradient>
    <symbol id="logo" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="9" fill="url(#lg)"/>
      <circle cx="16" cy="16" r="7" fill="none" style="stroke:var(--logo-ink)" stroke-width="3"/>
      <circle cx="16" cy="16" r="2.2" style="fill:var(--logo-ink)"/>
    </symbol>
  </defs>
</svg>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="logo"><use href="#logo"/></svg>
      <span class="brand-name">Chatly</span><span class="badge">ULTRA</span>
      <button id="collapse" class="icon-btn" title="Скрыть панель">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>

    <button id="new" class="new-chat">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Новый чат <kbd>Ctrl K</kbd>
    </button>

    <label class="search">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" placeholder="Поиск в чатах" autocomplete="off">
    </label>

    <nav id="list" class="list"></nav>

    <div class="side-bottom">
      <div class="plan"><b>Ultra</b><span>Безлимитный доступ</span></div>
      <button id="theme" class="ghost">
        <svg class="ic" id="theme-ic" viewBox="0 0 24 24"></svg>
        <span id="theme-t">Тема</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button id="expand" class="icon-btn expand" title="Показать панель">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <div class="model-wrap">
        <select id="model" class="model">
          <option>Chatly Ultra</option>
          <option>Chatly Ultra Mini</option>
        </select>
        <svg class="ic chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </header>

    <section id="scroll" class="scroll">
      <div id="empty" class="empty">
        <svg class="logo big"><use href="#logo"/></svg>
        <h1>Чем могу помочь?</h1>
        <p class="sub">Самый мощный интеллект. Без компромиссов.</p>
        <div class="chips" id="chips"></div>
      </div>
      <div id="thread" class="thread"></div>
    </section>

    <footer class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Спросите что-нибудь"></textarea>
        <button id="send" class="send" title="Отправить" disabled>
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
      <p class="note">Chatly Ultra · модель пока не подключена</p>
    </footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
